; Xdebug est installé mais désactivé par défaut (aucun impact sur les performances).
; Le mode réel est piloté par la variable d'environnement XDEBUG_MODE (cf. docker-compose.yml),
; qui est prioritaire sur xdebug.mode.
xdebug.mode=off
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
; Se connecte à l'IDE à chaque requête, sans cookie ni extension navigateur
xdebug.start_with_request=yes
; Pas d'avertissement dans les logs quand aucun IDE n'écoute
xdebug.log_level=0
